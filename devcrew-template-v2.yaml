params:
  name:
    type: string
    default: DevCrew
  description:
    type: string
    default: for the dev crew agents team
  deploy_agent:
    type: string
    default: conductor
  agent_1:
    type: string
    default: forge
  agent_2:
    type: string
    default: kudos
  agent_3:
    type: string
    default: pulse
  agent_4:
    type: string
    default: scout
  agent_5:
    type: string
    default: sentinel
room:
  name: "{name}"
  description: "{description}"
  bridge: Mattermost
  channel_type: channel_public
  read_visibility: public
  write_visibility: public
  agents:
    - "{deploy_agent}"
    - "{agent_1}"
    - "{agent_2}"
    - "{agent_3}"
    - "{agent_4}"
    - "{agent_5}"
  users:
    - switch-admin
    - user
